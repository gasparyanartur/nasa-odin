<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marswalk - Gale boxwork</title>
<!-- An empty icon: without it the browser asks for /favicon.ico and logs a 404 in the console. -->
<link rel="icon" href="data:,">
<script type="importmap">{"imports": {"three": "./vendor/three/build/three.module.js"}}</script>
<link rel="stylesheet" href="./src/styles/tokens.css">
<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/components.css">
<link rel="stylesheet" href="./src/styles/hud.css">
<!-- print.css holds the route card sheet for the on-screen preview too; its page rules apply in print only. -->
<link rel="stylesheet" href="./src/styles/print.css">
<link rel="stylesheet" href="./src/styles/app.css">
</head>
<body><a class="skip-link" href="#story-next">Skip to Next</a><!-- THESIS: The walk is a flight procedure told as a guided story on one chart: place, plan, walk, hazard, check. One thing per screen, a large Next button, everything else behind Details. OWN-WORLD: chart-paper plates, ink, one-pixel rules, no radius, no shadow; a cased aeronautical-magenta route over the Mars photobase; blue for rover data; hatches for classes; red and amber only for hazard states; the B612 cockpit face. FIRST VIEWPORT: Mars scene full-bleed, tilted and turning slowly; the name top left, the stepper top centre, Details and Show sources top right, one caption plate at the bottom with the magenta Next button. FORM: instrument approach plate, 3 of 7, seed 698f0d0d. -->
<div class="app" id="app" data-view="plan" data-step="1" data-sources="off">

  <!-- Scene: the 3D (or 2D) view full-bleed; labels over it are DOM elements placed with host.project(). -->
  <div class="scene" id="scene-frame">
    <canvas id="scene" class="scene__canvas" role="img" tabindex="0" aria-label="Map of the boxwork ridges at Gale crater. When it has the focus, arrow keys move the map."></canvas>
    <div class="scene__labels" id="labels"></div>
  </div>

  <!-- Helmet display layer (walk and hazard steps) -->
  <div class="hud-layer" id="hud"></div>

  <!-- Story chrome: name, stepper, Details and Show sources (ui/story.js) -->
  <header class="story-head" id="story-head"></header>

  <!-- The caption plate of the step, or the slim bar of the walk steps (ui/story.js) -->
  <div class="story-foot" id="story"></div>

  <!-- Details drawer: every panel as a tab (ui/drawer.js); out of the page while it is closed -->
  <aside class="drawer" id="drawer" aria-label="Details">
    <section class="drawer__panel" id="panel-limits" role="tabpanel" aria-labelledby="tab-limits"></section>
    <section class="drawer__panel" id="panel-timeline" role="tabpanel" aria-labelledby="tab-timeline"></section>
    <section class="drawer__panel" id="panel-layers" role="tabpanel" aria-labelledby="tab-layers"></section>
    <section class="drawer__panel" id="panel-stations" role="tabpanel" aria-labelledby="tab-stations"></section>
    <section class="drawer__panel" id="panel-editor" role="tabpanel" aria-labelledby="tab-editor"></section>
    <section class="drawer__panel" id="panel-rover" role="tabpanel" aria-labelledby="tab-rover"></section>
    <section class="drawer__panel" id="panel-credits" role="tabpanel" aria-labelledby="tab-credits"></section>
  </aside>

  <div class="app-notice" id="notice"></div>
</div>
<div class="boot" id="boot" data-open></div>
<div class="modal-layer" id="layer-modal"></div>
<div id="status" class="sr-only" role="status" aria-live="polite" data-nonmetric></div>
<noscript><p class="noscript">Marswalk needs JavaScript. Please turn it on and reload this page.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
