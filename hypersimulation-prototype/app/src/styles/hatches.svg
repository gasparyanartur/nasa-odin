<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false">
  <!-- AI-written (Claude, Anthropic) for the team's NASA Space Apps 2026 project. -->
  <!--
    Hatch law: slope classes and no-go zones are patterns on a fixed grey ramp, never colour alone.
    Pattern units are scene metres (the scene SVG uses one user unit per metre). The periods below
    give about 7 to 8 screen px at the plan zoom of the mock-ups (0.8 px per metre); at other zooms the
    app sets patternTransform="scale(k)" with k = 0.8 / (px per metre) so the period stays near 8 px.
      under 10 deg  = clear, no pattern
      10 to 15 deg  = hatch-caution: sparse ink dots, 12 m period, ink at 55 percent
      above 15 deg  = hatch-blocked: single 45 deg ink lines, 12 m period, 1.9 m wide, ink at 55 percent (blocked for the planner)
      no-go zone    = hatch-nogo: 0 and 90 deg cased grid on a 35 % ink tint, 7 m period, plus a cased dashed outline
    The app inlines this <defs> block once per page; CSS swatches in components.css (.swatch--*) draw the same geometry.
  -->
  <defs>
    <pattern id="hatch-caution" patternUnits="userSpaceOnUse" width="12" height="12">
      <circle cx="6" cy="6" r="1.5" fill="#14161a" fill-opacity="0.55"/>
    </pattern>
    <pattern id="hatch-blocked" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#14161a" stroke-width="1.9" stroke-opacity="0.55"/>
    </pattern>
    <pattern id="hatch-nogo" patternUnits="userSpaceOnUse" width="7" height="7">
      <rect width="7" height="7" fill="#14161a" fill-opacity="0.35"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#14161a" stroke-width="2.6"/>
      <line x1="0" y1="0" x2="7" y2="0" stroke="#14161a" stroke-width="2.6"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#f4f1ea" stroke-width="1"/>
      <line x1="0" y1="0" x2="7" y2="0" stroke="#f4f1ea" stroke-width="1"/>
    </pattern>
  </defs>
</svg>
